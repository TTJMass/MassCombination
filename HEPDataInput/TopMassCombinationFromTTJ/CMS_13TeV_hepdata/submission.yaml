---
comment: | # preserve newlines
   Measurement of the top quark pole mass using $\text{t}\overline{\text{t}}\text{+jet}$ events in the dilepton final state in proton-proton collisions at$\sqrt{s}=$ 13 TeV. A measurement of the top quark pole mass $m_{\text{t}}^{\text{pole}}$ in events where a top quark-antiquark pair ($\text{t}\overline{\text{t}}$) is produced in association with at least one additional jet ($\text{t}\overline{\text{t}}$+jet) is presented. This analysis is performed using proton-proton collision data at $\sqrt{s}=$ 13 TeV collected by the CMS experiment at the CERN LHC, corresponding to a total integrated luminosity of 36.3fb$^{-1}$. Events with two opposite-sign leptons in the final state ($\text{e}^{+}\text{e}^{-}$, $\mu^{+}\mu^{-}$, $\text{e}^{\pm}\mu^{\mp}$) are analyzed. The reconstruction of the main observable and the event selection are optimized using multivariate analysis techniques based on machine learning. The production cross section is measured as a function of the inverse of the invariant mass of the $\text{t}\overline{\text{t}}$+jet system at the parton level using a maximum likelihood unfolding. Given a reference parton distribution function (PDF), the top quark pole mass is extracted using the theoretical predictions at next-to-leading order. For the ABMP16NLO PDF, this results in $m_{\text{t}}^{\text{pole}}=172.94\pm1.37$.

