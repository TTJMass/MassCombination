comment: |
  Measurement of the top quark pole mass using $\text{t}\overline{\text{t}}\text{+jet}$ events in the semileptonic final state in proton-proton collisions at$\sqrt{s}=$ 8 TeV. 
A measurement of the top quark pole mass $m_{\text{t}}^{\text{pole}}$ in events where a top quark-antiquark pair ($\text{t}\overline{\text{t}}$) is produced in association with at least one additional jet ($\text{t}\overline{\text{t}}$+jet) is presented. This analysis is performed using proton-proton collision data at $\sqrt{s}=$ 8 TeV collected by the ATLAS experiment at the CERN LHC, corresponding to a total integrated luminosity of 20.2fb$^{-1}$. Events with one lepton, two $b$-tagged jets and one additional light-flavor jet  are analyzed. The reconstruction of the main observable and the event selection are optimized using kinematical cuts. The production cross section is measured as a function of the inverse of the invariant mass of the $\text{t}\overline{\text{t}}$+jet system at the parton level using an Iterative Bayesian unfolding technique. The top quark pole mass is extracted using the theoretical predictions at next-to-leading order, for different PDFs. For the CT10NLO PDF, this results in $m_{\text{t}}^{\text{pole}}=171.1\pm1.2$.

